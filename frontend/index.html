<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELTA // Scripts & Executors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap');
    :root { --primary: #3b82f6; --secondary: #2563eb; --bg-dark: #050505; --glass: rgba(15, 15, 15, 0.7); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --status-green: #10b981; --status-red: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.15), transparent 25%); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
    .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }
    
    /* --- HEADER & NAV --- */
    header { position: fixed; top: 0; left: 0; right: 0; height: 70px; padding: 0 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; backdrop-filter: blur(12px); background: rgba(10, 10, 10, 0.6); border-bottom: 1px solid var(--glass-border); }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Desktop Nav */
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; cursor: pointer; transition: 0.3s; } 
    .nav-links a:hover { color: white; }
    .nav-links a.active { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .btn-login { padding: 8px 20px; border-radius: 50px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white !important; font-weight: 600; }
    
    /* Mobile Toggle */
    .menu-btn { display: none; font-size: 1.5rem; color: white; cursor: pointer; z-index: 102; }

    /* --- RIGHT SLIDE MOBILE MENU --- */
    .mobile-menu {
        position: fixed; 
        top: 0; 
        right: -280px; /* Hidden off-screen to the right */
        width: 280px; 
        height: 100vh;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(20px);
        border-left: 1px solid var(--glass-border);
        padding: 80px 20px 20px; /* Padding top for header space */
        transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Smooth slide */
        z-index: 101;
        display: flex; flex-direction: column; gap: 15px;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    .mobile-menu.active { right: 0; } /* Slide in */
    
    .mobile-menu a {
        padding: 15px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        border-radius: 12px;
        transition: 0.2s;
        display: flex; align-items: center; gap: 12px;
    }
    .mobile-menu a:hover { background: rgba(255,255,255,0.05); color: white; }
    .mobile-menu a.active { color: white; background: linear-gradient(90deg, rgba(139,92,246,0.2), rgba(6,182,212,0.2)); border: 1px solid var(--glass-border); }

    /* Overlay (Dark background when menu is open) */
    .menu-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 100;
        opacity: 0; visibility: hidden;
        transition: 0.3s;
        backdrop-filter: blur(2px);
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }

    /* MEDIA QUERY FOR PHONES */
    @media (max-width: 768px) {
        .nav-links { display: none; } /* Hide desktop links */
        .menu-btn { display: block; } /* Show hamburger */
    }

    /* SECTIONS */
    .page-section { display: none; padding-top: 100px; animation: fadeIn 0.5s ease; }
    .page-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* CARD STYLES */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 100px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-top: 50px; }
    .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; transition: 0.3s; }
    .card:hover { transform: translateY(-10px); }
    .card-img-box { width: 100%; height: 180px; border-radius: 12px; overflow: hidden; margin-bottom: 20px; position: relative; background: #1e293b; }
    .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; margin-bottom: 8px; }
    .meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
    
    /* CARD ACTIONS */
    .card-actions { margin-top: auto; display: flex; gap: 10px; }
    .btn-copy, .btn-view { padding: 12px; border: 1px solid var(--glass-border); border-radius: 10px; cursor: pointer; color: white; background: #1e293b; transition: 0.3s; }
    .btn-copy { flex: 1; text-align: center; background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.2)); }
    .btn-copy:hover { background: var(--primary); }
    .btn-view:hover { background: var(--secondary); border-color: var(--secondary); }

    /* EXECUTOR STYLES */
    .exec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; }
    .exec-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; transition: 0.3s; }
    .exec-card:hover { transform: translateY(-5px); }
    .status-Online { border-color: var(--status-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    .status-Offline { border-color: var(--status-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
    .exec-body { padding: 25px; display: flex; gap: 20px; align-items: flex-start; }
    .exec-icon { width: 80px; height: 80px; border-radius: 12px; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; border: 1px solid var(--glass-border); overflow: hidden; }
    .exec-icon img { width: 100%; height: 100%; object-fit: cover; }
    .exec-info h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .exec-tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-family: 'Inter', sans-serif; font-weight: 600; text-transform: uppercase; }
    .exec-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 4px; }
    .exec-info p span { color: #fff; font-weight: 500; }
    .exec-download-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); color: white; border: none; border-top: 1px solid var(--glass-border); font-weight: 600; cursor: pointer; transition: 0.3s; display: block; text-align: center; text-decoration: none; }
    .exec-download-btn:hover { background: rgba(255,255,255,0.1); color: var(--secondary); }

    /* UTILS */
    .hero { text-align: center; padding: 60px 20px 40px; }
    .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 4rem; margin-bottom: 20px; }
    .search-container input { width: 100%; max-width: 500px; padding: 15px 20px; border-radius: 15px; background: var(--glass); border: 1px solid var(--glass-border); color: white; }
    
    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 2000; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box { background: #0f172a; padding: 30px; border-radius: 20px; border: 1px solid var(--glass-border); width: 90%; max-width: 500px; }
    .code-display { background: #0b1120; padding: 15px; color: #10b981; font-family: monospace; height: 150px; overflow-y: auto; margin: 15px 0; border-radius: 8px; }
</style>
</head>
<body>

<div class="bg-grid"></div>

<header>
    <div class="logo">DELTA<span style="color:var(--primary)">.</span></div>
    
    <nav class="nav-links">
        <a onclick="switchPage('home')" class="nav-item active" id="link-home">Discover</a>
        <a onclick="switchPage('executors')" class="nav-item" id="link-executors">Executors</a>
        <a href="#" class="btn-login" id="navAuthBtn" onclick="handleAuthNav()">Admin Panel</a>
    </nav>

    <div class="menu-btn" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMobileMenu()"></div>

<div class="mobile-menu" id="mobileMenu">
    <a onclick="mobileNavigate('home')" class="nav-item-m active" id="m-link-home"><i class="fas fa-search"></i> Discover</a>
    <a onclick="mobileNavigate('executors')" class="nav-item-m" id="m-link-executors"><i class="fas fa-microchip"></i> Executors</a>
    <a href="#" id="mNavAuthBtn" onclick="handleAuthNav()"><i class="fas fa-user"></i> Login / Profile</a>
</div>

<main id="page-home" class="page-section active">
    <section class="hero">
        <h1>Next Gen <br><span style="color:var(--secondary)">Roblox Scripting</span></h1>
        <p style="color:var(--text-muted)">Verified scripts, zero ads, instant execution.</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for games...">
        </div>
    </section>
    <div class="container">
        <div class="card-grid" id="scriptGrid"></div>
    </div>
</main>

<main id="page-executors" class="page-section">
    <div class="container">
        <div class="hero" style="padding-top: 0;">
            <h2 style="font-family:'Space Grotesk'; font-size:3rem; margin-bottom:10px;">Platform - All</h2>
            <p style="color:var(--text-muted)">Real-time status of popular Roblox executors.</p>
        </div>
        <div class="exec-grid" id="execGrid"></div>
    </div>
</main>

<div class="modal-overlay" id="scriptViewModal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="viewTitle" style="font-family:'Space Grotesk'; font-size:1.5rem;">Script</h2>
            <i class="fas fa-times" style="cursor:pointer;" onclick="closeModal('scriptViewModal')"></i>
        </div>
        <div class="code-display" id="viewCode"></div>
        <button onclick="copyCurrentCode()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Copy to Clipboard</button>
    </div>
</div>

<script>
    // --- STATE ---
    let scripts = [];
    let executors = [];
    let currentCode = "";

    // --- FETCH DATA ---
    async function loadData() {
        const [sRes, eRes] = await Promise.all([fetch('https://roblox-script-4dl2.onrender.com/api/scripts'), fetch('https://roblox-script-4dl2.onrender.com/api/executors')]);
        scripts = await sRes.json();
        executors = await eRes.json();
        renderScripts();
        renderExecutors();
    }

    // --- FORMAT VIEWS (1k, 1M) ---
    function formatViews(num) {
        if (!num) return 0;
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num;
    }

    // --- RENDER SCRIPTS ---
    function renderScripts(filter = '') {
        const grid = document.getElementById('scriptGrid');
        grid.innerHTML = '';
        scripts.forEach(s => {
            if(s.title.toLowerCase().includes(filter.toLowerCase()) && !s.deleted) {
                const timeAgo = calculateTimeAgo(s.timestamp);
                
                // USE NEW FORMATTER
                const displayViews = formatViews(s.views);

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-box">
                            <span class="badge">${s.badge}</span>
                            <img src="${s.image && s.image.startsWith('/') ? 'https://roblox-script-4dl2.onrender.com' + s.image : s.image}" onerror="this.src='https://via.placeholder.com/300'">
                        </div>
                        <h3>${s.title}</h3>
                        <div class="meta">
                            <span><i class="fas fa-user"></i> ${s.author}</span>
                            <span><i class="fas fa-clock"></i> ${timeAgo}</span>
                            <span><i class="fas fa-eye"></i> ${displayViews}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-copy" onclick="copyText(\`${s.code.replace(/`/g, '\\`')}\`)"><i class="fas fa-copy"></i> Copy Script</button>
                            <button class="btn-view" onclick="viewScript('${s.title.replace(/'/g, "\\'")}', \`${s.code.replace(/`/g, '\\`')}\`)"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>`;
            }
        });
    }

    // --- RENDER EXECUTORS ---
    function renderExecutors() {
        const grid = document.getElementById('execGrid');
        grid.innerHTML = '';
        executors.forEach(e => {
            grid.innerHTML += `
                <div class="exec-card status-${e.status}">
                    <div class="exec-body">
                        <div class="exec-icon">
                            ${e.image ? `<img src="${e.image && e.image.startsWith('/') ? 'https://roblox-script-4dl2.onrender.com' + e.image : e.image}">` : '<i class="fas fa-microchip"></i>'}
                        </div>
                        <div class="exec-info">
                            <h3>${e.title} <span class="exec-tag">${e.tag}</span></h3>
                            <p>Platform: <span>${e.platform}</span></p>
                            <p>Version: <span>${e.version || 'N/A'}</span></p>
                            <p>Updated: <span>${e.updated || 'N/A'}</span></p>
                        </div>
                    </div>
                    <a href="/download.html?id=${e.id}" class="exec-download-btn"><i class="fas fa-download"></i> Download</a>
                </div>`;
        });
    }

    // --- NAVIGATION LOGIC ---
    function switchPage(page) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.getElementById('link-' + page).classList.add('active');

        document.querySelectorAll('.nav-item-m').forEach(el => el.classList.remove('active'));
        if(document.getElementById('m-link-' + page)) {
            document.getElementById('m-link-' + page).classList.add('active');
        }
    }

    // --- MOBILE MENU LOGIC ---
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        const overlay = document.getElementById('menuOverlay');
        menu.classList.toggle('active');
        overlay.classList.toggle('active');
        
        // Toggle Icon
        const btnIcon = document.querySelector('.menu-btn i');
        if(menu.classList.contains('active')){
            btnIcon.classList.remove('fa-bars');
            btnIcon.classList.add('fa-times');
        } else {
            btnIcon.classList.remove('fa-times');
            btnIcon.classList.add('fa-bars');
        }
    }

    function mobileNavigate(page) {
        switchPage(page);
        toggleMobileMenu(); 
    }

    // --- UTILS ---
    function viewScript(title, code) {
        document.getElementById('viewTitle').innerText = title;
        document.getElementById('viewCode').innerText = code;
        currentCode = code;
        document.getElementById('scriptViewModal').classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function copyText(txt) { navigator.clipboard.writeText(txt); alert('Copied!'); }
    function copyCurrentCode() { copyText(currentCode); closeModal('scriptViewModal'); }

    // --- TIME FUNCTION ---
    function calculateTimeAgo(dateStr) {
        if (!dateStr) return "Just now";
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return "Recently"; 
        const diff = Math.floor((new Date() - date) / 1000);
        if (diff < 60) return "Just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        return Math.floor(diff / 86400) + "d ago";
    }

    function handleAuthNav() {
        const user = JSON.parse(localStorage.getItem('delta_user'));
        if(user) {
            window.location.href = '/profile.html';
        } else {
            window.location.href = '/login.html';
        }
    }

    function checkAuthUI() {
        const user = JSON.parse(localStorage.getItem('delta_user'));
        const btn1 = document.getElementById('navAuthBtn');
        const btn2 = document.getElementById('mNavAuthBtn');
        if(user) {
            btn1.innerText = user.role === 'admin' ? 'Admin Panel' : 'My Profile';
            btn2.innerHTML = user.role === 'admin' ? '<i class="fas fa-lock"></i> Admin Panel' : '<i class="fas fa-user"></i> My Profile';
        } else {
            btn1.innerText = 'Log In';
            btn2.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
        }
    }

    document.getElementById('searchInput').addEventListener('keyup', (e) => renderScripts(e.target.value));
    loadData();
    checkAuthUI();
</script>
</body>
</html>
