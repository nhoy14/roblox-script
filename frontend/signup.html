<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA // Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap');
        :root { --primary: #3b82f6; --secondary: #2563eb; --bg-dark: #050505; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.15), transparent 25%); 
            color: #f8fafc; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bg-grid { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); 
            background-size: 30px 30px; z-index: -1; 
        }
        .glass-panel { 
            background: rgba(10, 10, 10, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .brand-font { font-family: 'Space Grotesk', sans-serif; }
        .glass-input { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            transition: all 0.3s ease; 
        }
        .glass-input:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .login-btn {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating-element { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <!-- Decorative Orbs -->
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl floating-element" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-blue-700/20 rounded-full blur-3xl floating-element" style="animation-delay: 3s;"></div>

    <div class="glass-panel p-8 md:p-10 rounded-2xl w-[90%] max-w-md relative z-10 transform transition-all">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold brand-font mb-2">
                <a href="/" class="hover:opacity-80 transition">DELTA<span class="text-blue-500">.</span></a>
            </h1>
            <p class="text-gray-400 text-sm">Create an account to join the platform</p>
        </div>

        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider ml-1">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="username" class="glass-input w-full rounded-xl py-3 pl-10 pr-4 text-sm" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider ml-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="password" class="glass-input w-full rounded-xl py-3 pl-10 pr-4 text-sm" placeholder="Choose a password" required>
                </div>
            </div>

            <div id="errorMsg" class="hidden text-red-400 text-sm text-center bg-red-500/10 border border-red-500/20 py-2 rounded-lg">
                Username already exists!
            </div>

            <button type="submit" class="login-btn w-full py-4 rounded-xl text-white font-bold text-sm tracking-wide mt-4 flex justify-center items-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center text-xs text-gray-400">
            Already have an account? <a href="/login.html" class="text-secondary font-bold hover:underline">Log in</a>
        </div>
    </div>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const btn = document.querySelector('.login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';
            
            try {
                const res = await fetch('/api/users/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, password: pass})
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('delta_user', JSON.stringify(data.user));
                    window.location.href = '/profile.html';
                } else {
                    document.getElementById('errorMsg').innerText = data.error || 'Signup failed';
                    document.getElementById('errorMsg').classList.remove('hidden');
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                document.getElementById('errorMsg').innerText = 'Network error';
                document.getElementById('errorMsg').classList.remove('hidden');
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
